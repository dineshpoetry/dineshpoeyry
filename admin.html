<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Dinesh Poetry</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="wrap section"><a href="/">← Dinesh Poetry</a><h1>नयाँ रचना प्रकाशित गर्नुहोस्</h1><p class="muted">Cloudflare Pages environment मा ADMIN_TOKEN सेट हुनुपर्छ।</p><form id="f" class="card"><p><label>Admin token<br><input id="token" class="field" type="password" required></label></p><p><label>शीर्षक<br><input id="title" class="field" required></label></p><p><label>लेखक<br><input id="author" class="field"></label></p><p><label>भाषा<br><select id="lang" class="field"><option value="ne">नेपाली</option><option value="en">English</option></select></label></p><p><label>विधा<br><select id="genre" class="field"><option value="poem">कविता</option><option value="ghazal">गजल</option><option value="muktak">मुक्तक</option><option value="story">कथा</option><option value="essay">निबन्ध</option></select></label></p><p><label>पूरा पाठ<br><textarea id="content" class="field" rows="12" required style="width:100%"></textarea></label></p><button>प्रकाशित गर्नुहोस्</button><p id="result" class="muted"></p></form></main><script src="/assets/app.js"></script><script>$('#f').onsubmit=async e=>{e.preventDefault();let out=$('#result');out.textContent='प्रकाशित हुँदैछ…';try{let d=await api('/api/admin/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('#token').value},body:JSON.stringify({title:$('#title').value,author_name:$('#author').value,language:$('#lang').value,genre:$('#genre').value,text_content:$('#content').value,rights_status:'original'})});out.textContent='प्रकाशित भयो: '+d.slug;e.target.reset()}catch(err){out.textContent='त्रुटि: '+err.message}};</script></body></html>
