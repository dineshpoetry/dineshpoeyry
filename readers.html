<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>कवि तथा लेखक</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="header"><div class="wrap head"><a class="brand" href="/"><span class="logo">✒</span><span><b>Dinesh Poetry</b><br><span class="tag">शब्दमा भावना, कवितामा जीवन</span></span></a><nav><a href="/">गृहपृष्ठ</a><a href="/library.html">पुस्तकालय</a></nav></div></header><main class="wrap section"><h1>✍️ कवि तथा लेखकहरू</h1><p class="muted">प्रकाशित रचनाका लेखकहरू।</p><div id="list" class="grid"><div class="status">लोड हुँदैछ…</div></div></main><script src="/assets/app.js"></script><script>let el=$('#list');api('/api/poets').then(d=>{let a=d.poets||[];el.innerHTML=a.length?a.map(p=>`<article class="card"><h3>${esc(p.pen_name||p.name)}</h3><p>${esc(p.bio||'परिचय उपलब्ध छैन।')}</p><p class="small">${p.post_count||0} प्रकाशित रचना</p></article>`).join(''):'<div class="empty">अहिले सार्वजनिक लेखक प्रोफाइल छैन।</div>'}).catch(e=>fail(el,e));</script></body></html>
