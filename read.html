<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>रचना पढ्नुहोस्</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="header"><div class="wrap head"><a class="brand" href="/"><span class="logo">✒</span><span><b>Dinesh Poetry</b><br><span class="tag">शब्दमा भावना, कवितामा जीवन</span></span></a><nav><a href="/library.html">पुस्तकालय</a></nav></div></header><main class="wrap section"><a class="btn secondary" href="/library.html">← पुस्तकालय</a><article id="reader" class="reader"><div class="status">रचना लोड हुँदैछ…</div></article></main><script src="/assets/app.js"></script><script>let el=$('#reader'),slug=new URLSearchParams(location.search).get('slug');if(!slug)el.innerHTML='<div class="empty">रचनाको लिंक अपूर्ण छ।</div>';else api('/api/library?slug='+encodeURIComponent(slug)).then(d=>{let w=d.work;if(!w)throw Error('रचना भेटिएन');el.innerHTML=`<h2>${esc(w.title)}</h2><p class="byline">${esc(w.author_name||'अज्ञात लेखक')}</p><hr><div class="content">${esc(w.text_content||'पाठ उपलब्ध छैन।')}</div>${w.source_url?`<p><a class="btn secondary" href="${esc(w.source_url)}" target="_blank" rel="noopener">स्रोत खोल्नुहोस्</a></p>`:''}`}).catch(e=>fail(el,e));</script></body></html>
